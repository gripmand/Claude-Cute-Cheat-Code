<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A question for you 😏</title>
<meta name="theme-color" content="#ffb8d6" />
<meta name="description" content="A very important question, just for you 💕" />
<style>
  :root {
    --pink: #ff5d8f;
    --pink-deep: #d6336c;
    --pink-soft: #a14a6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #ffe3ee 0%, #ffd0e4 45%, #ffb8d6 100%);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  /* soft drifting glow blobs behind everything */
  .blob {
    position: fixed; border-radius: 50%; filter: blur(60px);
    opacity: .45; z-index: 0; pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  .blob.b1 { width: 320px; height: 320px; background: #ff9ec4; top: -80px; left: -60px; }
  .blob.b2 { width: 280px; height: 280px; background: #ffc2dd; bottom: -70px; right: -50px; animation-delay: -5s; }
  .blob.b3 { width: 220px; height: 220px; background: #ff7eb0; bottom: 30%; left: -80px; animation-delay: -9s; }
  @keyframes drift {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(40px,30px) scale(1.15); }
  }

  #app {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .card {
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 28px;
    padding: 40px 28px;
    max-width: 380px; width: 100%;
    text-align: center;
    box-shadow: 0 18px 50px rgba(255,105,160,.35);
    animation: pop .6s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(18px) scale(.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji { font-size: 60px; display: inline-block;
    filter: drop-shadow(0 8px 12px rgba(255,77,138,.5));
    animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%,100% {transform: scale(1);} 25% {transform: scale(1.18);} 40% {transform: scale(.96);} }

  h1 { margin: 18px 0 26px; font-size: clamp(24px, 6.5vw, 32px);
    font-weight: 800; color: var(--pink-deep); line-height: 1.3;
    text-shadow: 0 2px 10px rgba(255,255,255,.5); }

  p.sub { margin-top: 20px; font-size: 16px; color: var(--pink-soft); font-weight: 600; line-height: 1.5; }

  .meter { margin: 8px auto 22px; max-width: 240px; }
  .meter .label { font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--pink-soft); margin-bottom: 6px; opacity: .85; }
  .meter .track { height: 12px; border-radius: 999px; background: rgba(255,255,255,.55);
    overflow: hidden; box-shadow: inset 0 1px 3px rgba(214,51,108,.25); }
  .meter .fill { height: 100%; width: 8%;
    background: linear-gradient(90deg, #ff8fb6, #ff5d8f);
    border-radius: 999px; transition: width .35s cubic-bezier(.34,1.56,.64,1); }

  .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; min-height: 60px; }

  button {
    border: none; border-radius: 999px;
    font-size: 19px; font-weight: 700;
    padding: 15px 32px; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    font-family: inherit;
  }
  #yes { background: var(--pink); color: #fff;
    box-shadow: 0 8px 20px rgba(255,93,143,.5);
    animation: yesGlow 2s ease-in-out infinite; }
  @keyframes yesGlow {
    0%,100% { box-shadow: 0 8px 20px rgba(255,93,143,.5); }
    50% { box-shadow: 0 8px 30px rgba(255,93,143,.85); }
  }
  #yes:active { transform: scale(.94); }

  #no {
    background: #d9ccd3; color: #6a5560;
    box-shadow: 0 6px 14px rgba(0,0,0,.12);
    position: fixed;
    transition: top .2s cubic-bezier(.34,1.56,.64,1), left .2s cubic-bezier(.34,1.56,.64,1), transform .2s;
    z-index: 5;
  }

  /* floating hearts */
  #hearts { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .fh { position: absolute; bottom: -40px; animation: rise linear forwards; opacity: 0; will-change: transform; }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    10% { opacity: .9; }
    100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  /* confetti for the big yes */
  .confetti { position: fixed; top: -20px; z-index: 6; pointer-events: none;
    border-radius: 2px; animation: fall linear forwards; will-change: transform; }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
  }

  /* sound toggle */
  #sound {
    position: fixed; top: 14px; right: 14px; z-index: 7;
    width: 44px; height: 44px; padding: 0; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); color: var(--pink-deep);
    border: 1px solid rgba(255,255,255,.7);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 14px rgba(255,105,160,.3);
  }

  @media (prefers-reduced-motion: reduce) {
    *, .emoji, .blob, #yes { animation: none !important; }
    .fh { display: none; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div id="hearts"></div>
  <button id="sound" title="Toggle sound" aria-label="Toggle sound">🔈</button>
  <div id="app"><div class="card" id="card"></div></div>

<script>
  // ---------- tiny WebAudio blips (no files needed) ----------
  var soundOn = false, audioCtx = null;
  var soundBtn = document.getElementById('sound');
  soundBtn.onclick = function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔈';
    if (soundOn && !audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (soundOn) blip(660, .07);
  };
  function blip(freq, dur, type) {
    if (!soundOn || !audioCtx) return;
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.18, audioCtx.currentTime + .01);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function happyTune() {
    if (!soundOn || !audioCtx) return;
    var notes = [523, 659, 784, 1047, 784, 1047];
    notes.forEach(function (n, i) { setTimeout(function () { blip(n, .18, 'triangle'); }, i * 130); });
  }

  function vibrate(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---------- floating hearts ----------
  var heartsLayer = document.getElementById('hearts');
  var emojis = ['❤️','💕','💗','💖','💘','🩷','💞','💓'];
  function spawn() {
    var h = document.createElement('div');
    h.className = 'fh';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (16 + Math.random()*22) + 'px';
    var dur = 5 + Math.random()*5;
    h.style.animationDuration = dur + 's';
    heartsLayer.appendChild(h);
    setTimeout(function(){ h.remove(); }, dur*1000);
  }
  setInterval(spawn, 550);
  for (var i=0;i<8;i++) setTimeout(spawn, i*180);
  function burst(n){ for (var i=0;i<n;i++) setTimeout(spawn, i*40); }

  // ---------- confetti ----------
  var confColors = ['#ff5d8f','#ffd0e4','#ffb8d6','#ff9ec4','#ffe3ee','#d6336c','#fff'];
  function confetti(n) {
    for (var i = 0; i < n; i++) {
      (function () {
        var c = document.createElement('div');
        c.className = 'confetti';
        var size = 6 + Math.random()*8;
        c.style.width = size + 'px';
        c.style.height = (size*0.6) + 'px';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = confColors[Math.floor(Math.random()*confColors.length)];
        var dur = 2.4 + Math.random()*2.2;
        c.style.animationDuration = dur + 's';
        c.style.animationDelay = (Math.random()*0.4) + 's';
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, (dur+0.6)*1000);
      })();
    }
  }

  var card = document.getElementById('card');

  function showQuestion() {
    card.innerHTML =
      '<div class="emoji">😏</div>' +
      '<h1>Massages when I come over?</h1>' +
      '<div class="meter"><div class="label">Yes-o-meter</div>' +
        '<div class="track"><div class="fill" id="fill"></div></div></div>' +
      '<div class="buttons">' +
        '<button id="yes">Yes 💆‍♀️❤️</button>' +
        '<button id="no">No</button>' +
      '</div>';

    var yesBtn = document.getElementById('yes');
    yesBtn.onclick = showYes;
    yesBtn.onmouseenter = function () { blip(880, .06); };

    var no = document.getElementById('no');
    var fill = document.getElementById('fill');
    var taunts = ["No","Sure? 😏","Try again","Can't catch me!","Nope 🙅","Just say yes 🥺","Too slow!","Yes is right there 👉","Resistance is futile 💕","Okay fine, YES 😅"];
    var dodges = 0;

    function center() {
      var r = no.getBoundingClientRect();
      no.style.left = r.left + 'px';
      no.style.top  = r.top + 'px';
    }
    requestAnimationFrame(center);

    function flee(e) {
      if (e) e.preventDefault();
      dodges++;
      var bw = no.offsetWidth, bh = no.offsetHeight;
      var maxX = window.innerWidth  - bw - 12;
      var maxY = window.innerHeight - bh - 12;
      var nx = Math.max(12, Math.random()*maxX);
      var ny = Math.max(12, Math.random()*maxY);
      no.style.left = nx + 'px';
      no.style.top  = ny + 'px';
      no.style.transform = 'scale(' + Math.max(.55, 1 - dodges*0.045) + ')';
      no.textContent = taunts[Math.min(dodges, taunts.length-1)];

      // the more they chase "No", the more "Yes" takes over
      yesBtn.style.transform = 'scale(' + Math.min(1.6, 1 + dodges*0.06) + ')';
      fill.style.width = Math.min(100, 8 + dodges*11) + '%';

      blip(300 + dodges*40, .05, 'square');
      vibrate(15);
      spawn();

      // after enough dodges, "No" gives up entirely
      if (dodges >= taunts.length) {
        no.style.pointerEvents = 'none';
        no.style.opacity = '.35';
        fill.style.width = '100%';
      }
    }

    ['mouseover','mousedown','pointerdown','pointerenter','touchstart','focus','click'].forEach(function(evt){
      no.addEventListener(evt, flee, {passive:false});
    });
  }

  function showYes() {
    var no = document.getElementById('no');
    if (no) no.remove();
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = 'pop .6s cubic-bezier(.2,1.3,.4,1) both';
    card.innerHTML =
      '<div class="emoji">💆‍♀️</div>' +
      '<h1>Yesss 😏</h1>' +
      '<p class="sub">It\'s a date. I\'ve got you — best massages, guaranteed. 💕<br><br>Now hurry up and come over. ❤️</p>';
    burst(60);
    confetti(140);
    happyTune();
    vibrate([30, 40, 30, 40, 120]);
    var n=0; var party=setInterval(function(){ burst(10); confetti(30); if(++n>6) clearInterval(party); }, 350);
  }

  showQuestion();
  window.addEventListener('resize', function(){
    var no = document.getElementById('no');
    if (no) {
      var maxX = window.innerWidth - no.offsetWidth - 12;
      var maxY = window.innerHeight - no.offsetHeight - 12;
      no.style.left = Math.min(parseFloat(no.style.left)||20, maxX) + 'px';
      no.style.top  = Math.min(parseFloat(no.style.top)||20, maxY) + 'px';
    }
  });
</script>
</body>
</html>
