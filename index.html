<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A question for you 😏</title>
<meta name="theme-color" content="#ffd9e6" />
<meta name="description" content="A very important question, just for you 💕" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #ff6ea0;
    --pink-deep: #e84e85;
    --ink: #6b4a58;
    --ink-soft: #9c7e8b;
    --card: rgba(255, 255, 255, 0.72);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: "Quicksand", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(165deg, #fff1f6 0%, #ffe2ee 55%, #ffd2e4 100%);
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  /* one soft, subtle glow — just enough warmth, no clutter */
  body::before {
    content: ""; position: fixed; z-index: 0; pointer-events: none;
    width: 60vmax; height: 60vmax; border-radius: 50%;
    top: -20vmax; right: -15vmax;
    background: radial-gradient(circle, rgba(255,158,196,.45), transparent 65%);
    filter: blur(20px);
  }

  #app {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 26px;
    padding: 44px 34px 38px;
    max-width: 360px; width: 100%;
    text-align: center;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 24px 60px rgba(232,78,133,.22);
    animation: pop .55s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(16px) scale(.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji {
    font-size: 56px; line-height: 1; display: inline-block;
    filter: drop-shadow(0 6px 10px rgba(232,78,133,.35));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  h1 {
    margin: 20px 0 4px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(25px, 6.5vw, 31px);
    color: var(--pink-deep);
    line-height: 1.28;
    letter-spacing: -0.01em;
  }

  .tagline { margin-bottom: 30px; font-size: 14.5px; font-weight: 500; color: var(--ink-soft); }

  p.sub {
    margin-top: 16px; font-size: 16px; font-weight: 500;
    color: var(--ink); line-height: 1.6;
  }

  /* Yes + No, clean and side by side */
  .buttons {
    display: flex; gap: 14px; justify-content: center; align-items: center;
    min-height: 56px;
  }

  button {
    border: none; cursor: pointer;
    font-family: inherit; font-weight: 700;
    font-size: 17px; padding: 14px 30px;
    border-radius: 16px;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, background .2s ease;
  }

  #yes {
    background: linear-gradient(180deg, #ff85ad, var(--pink));
    color: #fff;
    box-shadow: 0 8px 18px rgba(255,110,160,.45);
  }
  #yes:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(255,110,160,.55); }
  #yes:active { transform: translateY(0) scale(.96); }

  #no {
    background: #fff;
    color: var(--ink-soft);
    box-shadow: 0 4px 12px rgba(107,74,88,.12);
    position: relative; /* starts inline, switches to fixed only when it flees */
    z-index: 5;
  }
  #no.loose {
    position: fixed;
    transition:
      top .25s cubic-bezier(.34,1.56,.64,1),
      left .25s cubic-bezier(.34,1.56,.64,1),
      transform .2s ease;
  }

  /* floating hearts — fewer, softer */
  #hearts { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .fh { position: absolute; bottom: -40px; opacity: 0; will-change: transform; animation: rise linear forwards; }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    12% { opacity: .55; }
    100% { transform: translateY(-115vh) rotate(220deg); opacity: 0; }
  }

  /* confetti */
  .confetti { position: fixed; top: -20px; z-index: 6; pointer-events: none;
    border-radius: 2px; animation: fall linear forwards; will-change: transform; }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(680deg); opacity: 1; }
  }

  /* sound toggle — quiet, tucked in the corner */
  #sound {
    position: fixed; top: 16px; right: 16px; z-index: 7;
    width: 42px; height: 42px; padding: 0; font-size: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.7); color: var(--pink-deep);
    border: 1px solid rgba(255,255,255,.85);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 12px rgba(232,78,133,.18);
  }
  #sound:active { transform: scale(.92); }

  @media (prefers-reduced-motion: reduce) {
    *, .emoji { animation: none !important; }
    .fh { display: none; }
  }
</style>
</head>
<body>
  <div id="hearts"></div>
  <button id="sound" title="Toggle sound" aria-label="Toggle sound">🔈</button>
  <div id="app"><div class="card" id="card"></div></div>

<script>
  // ---------- tiny WebAudio blips (no files needed) ----------
  var soundOn = false, audioCtx = null;
  var soundBtn = document.getElementById('sound');
  soundBtn.onclick = function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔈';
    if (soundOn && !audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (soundOn) blip(660, .07);
  };
  function blip(freq, dur, type) {
    if (!soundOn || !audioCtx) return;
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.16, audioCtx.currentTime + .01);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function happyTune() {
    if (!soundOn || !audioCtx) return;
    var notes = [523, 659, 784, 1047, 784, 1047];
    notes.forEach(function (n, i) { setTimeout(function () { blip(n, .18, 'triangle'); }, i * 130); });
  }

  function vibrate(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---------- floating hearts ----------
  var heartsLayer = document.getElementById('hearts');
  var emojis = ['❤️','💕','💗','💖','🩷'];
  function spawn() {
    var h = document.createElement('div');
    h.className = 'fh';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*16) + 'px';
    var dur = 6 + Math.random()*5;
    h.style.animationDuration = dur + 's';
    heartsLayer.appendChild(h);
    setTimeout(function(){ h.remove(); }, dur*1000);
  }
  setInterval(spawn, 850);
  for (var i=0;i<5;i++) setTimeout(spawn, i*260);
  function burst(n){ for (var i=0;i<n;i++) setTimeout(spawn, i*40); }

  // ---------- confetti ----------
  var confColors = ['#ff6ea0','#ffd0e4','#ffb8d6','#ff9ec4','#fff0f5','#e84e85','#fff'];
  function confetti(n) {
    for (var i = 0; i < n; i++) {
      (function () {
        var c = document.createElement('div');
        c.className = 'confetti';
        var size = 6 + Math.random()*8;
        c.style.width = size + 'px';
        c.style.height = (size*0.6) + 'px';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = confColors[Math.floor(Math.random()*confColors.length)];
        var dur = 2.4 + Math.random()*2.2;
        c.style.animationDuration = dur + 's';
        c.style.animationDelay = (Math.random()*0.4) + 's';
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, (dur+0.6)*1000);
      })();
    }
  }

  var card = document.getElementById('card');

  function showQuestion() {
    card.innerHTML =
      '<div class="emoji">😏</div>' +
      '<h1>Massages when I<br>come over?</h1>' +
      '<div class="tagline">Choose wisely 💆‍♀️</div>' +
      '<div class="buttons">' +
        '<button id="yes">Yes 💕</button>' +
        '<button id="no">No</button>' +
      '</div>';

    var yesBtn = document.getElementById('yes');
    yesBtn.onclick = showYes;
    yesBtn.onmouseenter = function () { blip(880, .06); };

    var no = document.getElementById('no');
    var taunts = ["No","Hmm? 😏","Try again","Nope 🙅","So close!","Just say yes 🥺","Too slow!","It's right there 👉","Resistance is futile 💕","Okay fine — yes 😅"];
    var dodges = 0;

    function flee(e) {
      if (e) e.preventDefault();
      dodges++;

      // detach into free-floating mode on the first dodge
      if (!no.classList.contains('loose')) {
        var r = no.getBoundingClientRect();
        no.style.width = r.width + 'px';
        no.style.height = r.height + 'px';
        no.style.left = r.left + 'px';
        no.style.top = r.top + 'px';
        no.classList.add('loose');
      }

      var bw = no.offsetWidth, bh = no.offsetHeight;
      var maxX = window.innerWidth  - bw - 14;
      var maxY = window.innerHeight - bh - 14;
      var nx = Math.max(14, Math.random()*maxX);
      var ny = Math.max(14, Math.random()*maxY);
      no.style.left = nx + 'px';
      no.style.top  = ny + 'px';
      no.style.transform = 'scale(' + Math.max(.6, 1 - dodges*0.04) + ')';
      no.textContent = taunts[Math.min(dodges, taunts.length-1)];

      yesBtn.style.transform = 'scale(' + Math.min(1.4, 1 + dodges*0.05) + ')';

      blip(320 + dodges*40, .05, 'square');
      vibrate(12);

      // eventually "No" gives up
      if (dodges >= taunts.length) {
        no.style.pointerEvents = 'none';
        no.style.opacity = '.4';
      }
    }

    ['mouseover','mousedown','pointerdown','pointerenter','touchstart','focus','click'].forEach(function(evt){
      no.addEventListener(evt, flee, {passive:false});
    });
  }

  function showYes() {
    var no = document.getElementById('no');
    if (no) no.remove();
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = 'pop .55s cubic-bezier(.2,1.2,.4,1) both';
    card.innerHTML =
      '<div class="emoji">💆‍♀️</div>' +
      '<h1>Yesss 😏</h1>' +
      '<p class="sub">It\'s a date. I\'ve got you — best massages, guaranteed. 💕<br><br>Now hurry up and come over. ❤️</p>';
    burst(50);
    confetti(140);
    happyTune();
    vibrate([30, 40, 30, 40, 120]);
    var n=0; var party=setInterval(function(){ burst(8); confetti(28); if(++n>6) clearInterval(party); }, 350);
  }

  showQuestion();
  window.addEventListener('resize', function(){
    var no = document.getElementById('no');
    if (no && no.classList.contains('loose')) {
      var maxX = window.innerWidth - no.offsetWidth - 14;
      var maxY = window.innerHeight - no.offsetHeight - 14;
      no.style.left = Math.min(parseFloat(no.style.left)||20, maxX) + 'px';
      no.style.top  = Math.min(parseFloat(no.style.top)||20, maxY) + 'px';
    }
  });
</script>
</body>
</html>
